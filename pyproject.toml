[project]
name = "weightcraft"
version = "0.1.0"
description = "Pure portfolio-construction numerics: sizing, risk, turnover, alignment."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "Mark Aron Szulyovszky" }]
dependencies = ["numpy>=2.3", "polars>=1.33"]

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=weightcraft",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "possibly-undefined",
  "explicit-override",
]

[[tool.mypy.overrides]]
module = "tests.*"
# Hypothesis' decorators are untyped enough that strict mode cannot see through
# them; the bodies are still checked.
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The formatter owns these two; enabling them fights `ruff format`.
  "COM812",
  "ISC001",
  # A docstring earns its place by saying something the code cannot, so a
  # missing one is not a finding.
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",
  # `D203`/`D213` contradict `D211`/`D212`, which we do want.
  "D203", "D213",
  # This is a private repo with a LICENSE file; a per-file banner buys nothing.
  "CPY001",
  # The house style asks a docstring to say what the function *is* -- the shape
  # it returns, the expression it reproduces -- which is a noun phrase, not a
  # command.
  "D401",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "SLF001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "weightcraft is numpy + polars only. See README."

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["weightcraft"]
